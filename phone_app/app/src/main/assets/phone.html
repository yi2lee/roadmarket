<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>로드마켓</title>
<style>
:root {
  --bg: #FFFFFF; --text: #17191C; --sub: #5C6370; --weak: #8B929E; --line: #E9ECEF; --soft: #F4F6F8; --card: #FFFFFF;
  --brand: #04695A; --brand-press: #035347; --brand-soft: #E6F2EF; --on-brand: #FFFFFF;
  --danger: #D64545; --danger-soft: #FDEDED; --amber: #F2A100; --amber-soft: #FFF4DC; --amber-text: #7A4F00;
  --info-soft: #EEF3FB; --info-text: #1F3A68; --scrim: rgba(17, 20, 19, .45); --kakao: #FEE500; --kakao-text: rgba(0,0,0,.85);
  --float: 0 4px 14px rgba(0,0,0,.16);
  --font: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #111413; --text: #F2F4F3; --sub: #AEB6B3; --weak: #848C89; --line: #2A302E; --soft: #1B1F1E; --card: #1B1F1E;
    --brand: #3FB39B; --brand-press: #35997F; --brand-soft: #173A33; --on-brand: #08201B;
    --danger: #F07A7A; --danger-soft: #3A1E1E; --amber: #F5B23A; --amber-soft: #33280F; --amber-text: #F5C76A;
    --info-soft: #18243A; --info-text: #B9CCF0; --scrim: rgba(0,0,0,.6); --float: 0 4px 14px rgba(0,0,0,.5);
  }
}
:root[data-theme=dark] {
  --bg: #111413; --text: #F2F4F3; --sub: #AEB6B3; --weak: #848C89; --line: #2A302E; --soft: #1B1F1E; --card: #1B1F1E;
  --brand: #3FB39B; --brand-press: #35997F; --brand-soft: #173A33; --on-brand: #08201B;
  --danger: #F07A7A; --danger-soft: #3A1E1E; --amber: #F5B23A; --amber-soft: #33280F; --amber-text: #F5C76A;
  --info-soft: #18243A; --info-text: #B9CCF0; --scrim: rgba(0,0,0,.6); --float: 0 4px 14px rgba(0,0,0,.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 400 16px/24px var(--font); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s18 { width: 18px; height: 18px; } svg.i.s20 { width: 20px; height: 20px; } svg.i.s14 { width: 14px; height: 14px; stroke-width: 2.2; }
.sub { color: var(--sub); font-size: 14px; line-height: 20px; }
.weak { color: var(--weak); font-size: 13px; line-height: 18px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 20px; border-radius: 12px;
       font-size: 16px; font-weight: 700; width: 100%; transition: background-color .15s, opacity .15s; user-select: none; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:active { background: var(--brand-press); }
.btn.soft { background: var(--soft); color: var(--text); }
.btn.soft:active { background: var(--line); }
.btn.tint { background: var(--brand-soft); color: var(--brand); }
.btn.line { background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { min-height: 48px; font-size: 15px; padding: 0 16px; border-radius: 10px; width: auto; }
.btn.text { min-height: 48px; width: auto; padding: 0 12px; color: var(--brand); font-weight: 700; }
.btn.danger-text { min-height: 48px; color: var(--danger); font-weight: 700; }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary:disabled { background: var(--brand); }
.btn.busy { opacity: .7; }
.row2 { display: flex; gap: 8px; } .row2 > .btn:first-child { flex: 1; } .row2 > .btn:last-child { flex: 2; }
.row2.even > .btn { flex: 1; }

/* 입력 */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .flabel { font-size: 14px; font-weight: 700; line-height: 20px; display: flex; justify-content: space-between; align-items: baseline; }
.field > label .opt, .flabel .opt { color: var(--weak); font-weight: 400; }
.field > label .cnt { color: var(--weak); font-weight: 400; font-size: 13px; }
.inp { height: 52px; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 16px; font-size: 16px; outline: none; }
textarea.inp { height: auto; min-height: 88px; padding: 14px 16px; line-height: 24px; resize: none; }
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.inp::placeholder { color: var(--weak); }
.inp:disabled { background: var(--soft); color: var(--weak); }
.inp.bad { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.suffix { position: relative; } .suffix .inp { padding-right: 44px; }
.suffix > span { position: absolute; right: 16px; top: 14px; color: var(--sub); }
.err { color: var(--danger); font-size: 14px; line-height: 20px; display: flex; gap: 6px; align-items: flex-start; }
.err:empty { display: none; }
.err svg { margin-top: 1px; }
.help { color: var(--sub); font-size: 14px; line-height: 20px; }
.autofill { color: var(--brand); font-size: 14px; line-height: 20px; display: flex; gap: 6px; align-items: center; }
.inline { display: flex; gap: 8px; } .inline .inp { flex: 1; min-width: 0; } .inline .btn { flex: none; min-height: 52px; }

/* 안내 상자 */
.note { display: flex; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--soft); align-items: flex-start; }
.note .nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.note b { font-size: 15px; line-height: 22px; }
.note span { font-size: 14px; line-height: 20px; color: var(--sub); }
.note.info { background: var(--info-soft); color: var(--info-text); } .note.info span { color: var(--info-text); opacity: .85; }
.note.warn { background: var(--amber-soft); color: var(--amber-text); } .note.warn span { color: var(--amber-text); opacity: .9; }
.note.bad { background: var(--danger-soft); color: var(--danger); } .note.bad span { color: var(--danger); opacity: .9; }
.note.ok { background: var(--brand-soft); color: var(--brand); } .note.ok span { color: var(--brand); opacity: .9; }
.note .btn { flex: none; align-self: center; }
.note svg.i { margin-top: 1px; }

/* 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 700; line-height: 24px; background: var(--soft); color: var(--sub); white-space: nowrap; }
.chip.g { background: var(--brand-soft); color: var(--brand); }
.chip.d { background: var(--brand); color: var(--on-brand); }

/* 앱 뼈대 */
#main { min-height: 100vh; padding-bottom: 96px; }
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 22px; line-height: 30px; font-weight: 700; flex: 1; }
.logo { display: flex; align-items: center; gap: 6px; flex: 1; color: var(--brand); }
.logo .mark { width: 22px; height: 26px; }
.logo .word { height: 19px; width: 73px; }
.carchip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--sub); min-height: 32px; position: relative; }
.carchip::after { content: ""; position: absolute; inset: -8px -4px; }
.carchip.on { background: var(--brand-soft); color: var(--brand); }
.view { padding: 4px 20px 0; display: flex; flex-direction: column; gap: 28px; }
.sect { display: flex; flex-direction: column; gap: 12px; }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.shead h2 { font-size: 17px; line-height: 24px; font-weight: 700; }
.shead .weak { text-align: right; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 64px; display: flex; background: var(--bg); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--weak); font-size: 13px; line-height: 16px; }
.tabbar button[aria-selected=true] { color: var(--brand); font-weight: 700; }
.tabbar button[aria-selected=true] svg { stroke-width: 2.2; }
.fab { position: fixed; right: 20px; bottom: 80px; z-index: 19; display: inline-flex; align-items: center; gap: 6px; height: 52px; padding: 0 20px 0 16px;
       border-radius: 26px; background: var(--brand); color: var(--on-brand); font-size: 16px; font-weight: 700; box-shadow: var(--float); }
.fab:active { background: var(--brand-press); }
.fab.quiet { background: var(--bg); color: var(--brand); box-shadow: var(--float), inset 0 0 0 1.5px var(--brand); }
.band { position: fixed; left: 12px; right: 12px; bottom: 72px; z-index: 19; display: flex; align-items: center; gap: 10px; min-height: 60px;
        padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--brand); color: var(--on-brand); box-shadow: var(--float); text-align: left; width: auto; }
.band .bt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.band .bt b { font-size: 15px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band .bt span { font-size: 13px; line-height: 18px; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band .more { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.22); }
.band .go { flex: none; height: 44px; padding: 0 14px; border-radius: 10px; background: #fff; color: #04695A; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; }
.band .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--amber); flex: none; }

/* 카드 */
.card { border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.card.fill { border: 0; background: var(--soft); }
.card.urgent { border-color: var(--amber); }
.card .eyebrow { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--brand); line-height: 18px; }
.card .eyebrow.am { color: var(--amber-text); }
.card h3 { font-size: 18px; line-height: 26px; font-weight: 700; }
.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .tt { display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: var(--amber-text); font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--amber-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--amber); border-radius: 3px; transition: width 1s linear; }

/* 물건 줄 */
.items { display: flex; flex-direction: column; }
.irow { display: flex; gap: 14px; align-items: center; padding: 12px 0; width: 100%; text-align: left; min-height: 88px; border-bottom: 1px solid var(--line); }
.irow:last-child { border-bottom: 0; }
.irow:active { background: var(--soft); }
.thumb { width: 64px; height: 64px; border-radius: 12px; flex: none; background: var(--soft); color: var(--weak); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.irow .it { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.irow .nm { font-size: 16px; font-weight: 600; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .pr { font-size: 16px; font-weight: 700; line-height: 22px; }
.irow .chips { margin-top: 4px; }
.irow.dim .thumb, .irow.dim .nm, .irow.dim .pr { opacity: .5; }
.irow > svg.i { color: var(--weak); }
.mini { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--soft); }
.mini .thumb { width: 48px; height: 48px; border-radius: 10px; background: var(--bg); }
.mini .it { flex: 1; min-width: 0; }
.mini .nm { font-size: 15px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .pr { font-size: 15px; font-weight: 700; line-height: 22px; }

/* 할 일 목록 */
.tasks { display: flex; flex-direction: column; }
.task { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-height: 64px; }
.task .ck { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; color: var(--on-brand); }
.task.done .ck { background: var(--brand); border-color: var(--brand); }
.task .tx { flex: 1; min-width: 0; }
.task .tx b { display: block; font-size: 16px; line-height: 22px; }
.task.done .tx b { color: var(--weak); text-decoration: line-through; }
.task .tx span { font-size: 13px; line-height: 18px; color: var(--sub); }

/* 목록 줄(설정) */
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 0; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow .lt { flex: 1; min-width: 0; }
.lrow .lt b { display: block; font-weight: 400; font-size: 16px; line-height: 22px; }
.lrow .lt span { display: block; font-size: 13px; line-height: 18px; color: var(--sub); }
.lrow .rv { color: var(--sub); font-size: 15px; }
.lrow > svg.i { color: var(--sub); }
.lrow > svg.i.chev { color: var(--weak); }
.lrow.danger, .lrow.danger > svg.i { color: var(--danger); }
.lrow:active { background: var(--soft); }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; transition: background-color .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw[aria-checked=true] { background: var(--brand); } .sw[aria-checked=true]::after { transform: translateX(20px); }

.empty { text-align: center; padding: 32px 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty .ei { width: 56px; height: 56px; border-radius: 28px; background: var(--soft); color: var(--weak); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.empty b { font-size: 17px; line-height: 24px; }
.empty .btn { margin-top: 12px; width: auto; }
.profile { display: flex; align-items: center; gap: 14px; }
.ava { width: 52px; height: 52px; border-radius: 26px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
.ava.lg { width: 72px; height: 72px; border-radius: 36px; font-size: 28px; }
.profile .pt { flex: 1; min-width: 0; } .profile .pt b { display: block; font-size: 18px; line-height: 26px; }
.wrow { display: flex; align-items: center; gap: 8px; min-height: 56px; border-bottom: 1px solid var(--line); }
.wrow .nm { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
.iconbtn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 24px; color: var(--sub); flex: none; }
.iconbtn:active { background: var(--soft); }
.iconbtn:disabled { opacity: .4; }

/* 덮는 화면 */
.layer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; opacity: 0; transform: translateX(16px); transition: opacity .18s, transform .18s; }
.layer.in { opacity: 1; transform: none; }
.layer.out { opacity: 0; transform: translateX(16px); }
.lhead { height: 56px; display: flex; align-items: center; padding: 0 4px; flex: none; position: relative; }
.lhead h2 { position: absolute; left: 64px; right: 64px; text-align: center; font-size: 17px; font-weight: 700; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.lhead .iconbtn { color: var(--text); }
.lhead .rt { margin-left: auto; padding-right: 16px; color: var(--weak); font-size: 14px; }
.lbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 28px; }
.lbody .stack { gap: 12px; }
.lfoot { flex: none; padding: 12px 20px 16px; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.lfoot .why { text-align: center; font-size: 13px; line-height: 18px; color: var(--sub); }
.ltitle { font-size: 22px; line-height: 30px; font-weight: 700; }

/* 아래에서 올라오는 판 */
.sheetwrap { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; opacity: 0; transition: opacity .18s; }
.sheetwrap.in { opacity: 1; } .sheetwrap.out { opacity: 0; }
.sheet { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px; transform: translateY(24px); transition: transform .2s; }
.sheetwrap.in .sheet { transform: none; }
.handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; flex: none; }
.sheet h2 { font-size: 20px; line-height: 28px; font-weight: 700; }
.sheet .stxt { color: var(--sub); font-size: 15px; line-height: 22px; margin-top: -8px; }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

/* 거래 화면 */
.layer.deal .lbody { padding: 0; gap: 0; }
.mapzone { position: relative; z-index: 0; isolation: isolate; height: 42vh; min-height: 240px; background: var(--soft); flex: none; }
.mapzone .slot { position: absolute; inset: 0; }
.mapzone .map { width: 100%; height: 100%; }   /* Leaflet이 칸에 position: relative를 넣어요. 그래서 크기는 바깥 칸이 정해요 */
.mapzone .mapnote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 72px 20px 20px; }
.mapzone .mapnote .note { width: 100%; }
.floatback { position: absolute; left: 12px; top: 12px; z-index: 500; width: 48px; height: 48px; border-radius: 24px; background: var(--bg); color: var(--text); box-shadow: var(--float); display: flex; align-items: center; justify-content: center; }
.panel { position: relative; margin-top: -16px; background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; z-index: 2; }
.eta { font-size: 22px; line-height: 30px; font-weight: 700; }
.eta em { font-style: normal; font-size: 40px; line-height: 48px; color: var(--brand); margin-right: 2px; }
.place { display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--sub); }
.place b { color: var(--text); font-weight: 700; }
.plate { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
.plate span { flex: 1; color: var(--sub); }
.plate b { font-size: 26px; line-height: 32px; letter-spacing: 2px; font-weight: 700; font-variant-numeric: tabular-nums; }
.map .leaflet-control-attribution { font-size: 11px; }
.tag { display: inline-block; transform: translate(-50%, -100%); white-space: nowrap; font: 700 13px/18px var(--font); padding: 4px 8px; border-radius: 8px; background: var(--brand); color: var(--on-brand); border: 2px solid var(--bg); }
.tag.buyer { background: #17191C; color: #fff; }
.tag.k { transform: none; margin-bottom: 4px; }

/* 요청 판 */
.reqhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.reqhead .eyebrow { color: var(--brand); font-size: 13px; font-weight: 700; }
.buyer { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--soft); }
.buyer .ava { width: 44px; height: 44px; font-size: 17px; }
.buyer .bt { flex: 1; min-width: 0; } .buyer .bt b { display: block; font-size: 16px; line-height: 22px; }
.buyer .dist { text-align: right; } .buyer .dist b { display: block; font-size: 22px; line-height: 28px; color: var(--brand); }

/* 별점 */
.stars { display: flex; justify-content: center; align-items: center; gap: 4px; }
.stars button { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; color: var(--line); }
.stars button svg { width: 38px; height: 38px; stroke-width: 1.4; }
.stars button.on { color: #F2A100; } .stars button.on svg { fill: currentColor; }
.stars .zero { width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid var(--line); color: var(--sub); font-weight: 700; margin-right: 6px; }
.stars .zero.on { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }

/* 올리기 도우미 */
.helpers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.helper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 92px; padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px; text-align: center; overflow: hidden; position: relative; }
.helper b { font-size: 14px; line-height: 20px; }
.helper span { font-size: 12px; line-height: 16px; color: var(--weak); }
.helper svg.i { color: var(--brand); }
.helper.on { border-color: var(--brand); background: var(--brand-soft); }
.helper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.helper .ph { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 700; line-height: 26px; }
.locs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.loc { display: flex; flex-direction: column; gap: 2px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; text-align: left; min-height: 72px; }
.loc b { display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 22px; }
.loc span { font-size: 13px; line-height: 18px; color: var(--sub); }
.loc[aria-checked=true] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
.loc[aria-checked=true] b { color: var(--brand); }
.progress { height: 4px; border-radius: 2px; background: var(--brand-soft); overflow: hidden; position: relative; }
.progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--brand); border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { left: -40%; } to { left: 100%; } }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* 시작·처음 설정·불러오기 */
.full { min-height: 100vh; display: flex; flex-direction: column; padding: 0 20px 20px; }
.full .grow { flex: 1; }
.hero { padding-top: 72px; display: flex; flex-direction: column; gap: 20px; }
.hero .brand { display: flex; align-items: center; gap: 10px; color: var(--brand); }
.hero .brand .mark { width: 34px; height: 40px; } .hero .brand .word { width: 120px; height: 31px; }
.hero h1 { font-size: 26px; line-height: 36px; font-weight: 700; }
.points { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
.point { display: flex; gap: 14px; align-items: flex-start; }
.point .pi { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
.point b { display: block; font-size: 16px; line-height: 22px; }
.btn.kakao { background: var(--kakao); color: var(--kakao-text); }
.testlink { margin: 12px auto 0; display: block; min-height: 48px; padding: 0 16px; color: var(--weak); font-size: 13px; text-decoration: underline; }
.stepbar { display: flex; gap: 6px; } .stepbar i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .stepbar i.on { background: var(--brand); }
.choice { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; text-align: left; width: 100%; min-height: 76px; }
.choice:active { background: var(--soft); }
.choice .pi { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
.choice .ct { flex: 1; } .choice .ct b { display: block; font-size: 16px; line-height: 22px; }
.choice > svg.i { color: var(--weak); }
.center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; }
.center b { font-size: 18px; line-height: 26px; }

body.netoff { padding-top: 36px; }
.netbar { position: fixed; top: 0; left: 0; right: 0; z-index: 90; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 6px 16px; background: #17191C; color: #fff; font-size: 14px; line-height: 20px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 144px; z-index: 95; display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px; min-height: 52px; border-radius: 12px; background: #17191C; color: #fff; font-size: 15px; line-height: 22px; box-shadow: var(--float); opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none; }
.toast.in { opacity: 1; transform: none; pointer-events: auto; }
.toast span { flex: 1; } .toast .btn.text { color: #6FD3BC; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 0s !important; } }
html.mock * { transition: none !important; }

// 긴 쪽 1280으로 줄여 JPEG로 (서버는 JPEG 머리만 받아요)
async function shrink(file) {

    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));

    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

  seen = { r1: Date.now() - 70000 }; saveSeen();
  autoSeen.add("r1"); prevReqs = [];
  const notifyBridge = () => { window.RoadMarketApp = { askNotify() {}, notifyOn() { return false; } }; };
  switch (name) {
    case "start": token = ""; drawStart(); showScreen("start"); loginOptions(); break;
    case "start_err": token = ""; loginErr = true; drawStart(); showScreen("start"); loginOptions(); break;
    case "onboard1": set(fresh()); onState(); break;
    case "onboard2": set(fresh()); onState(); drawOnboard(2); break;
    case "home_empty": save("rm_onboard", "1"); notifyBridge(); go(fresh()); break;
    case "home": case "home_items": case "items": go(base()); break;
    case "home_request": { const s = base(); s.requests = [reqA]; go(s); break; }
    case "home_deal": { const s = base(); s.deal = dealA; go(s); break; }
    case "home_ask": go(ask()); break;
    case "home_urgent": { const s = base(); s.urgents = [urgA]; go(s); break; }
    case "home_nocar": { const s = base(); s.car = false; s.me.plate4 = ""; go(s); break; }
    case "offline": go(base()); fails = 1; onFail(); break;
    case "fatal": set(base()); got = false; onFail(); break;
    case "item": go(base()); openItem("s3"); break;
    case "confirm": go(base()); openItem("s3"); removeItem(sells[3], layers[0]); break;
    case "sell1": go(base()); openSell(); break;
    case "sell2": { go(base()); const L = openSell(); const a = L.api; a.name.value = "리안 솔로 유모차"; a.name.oninput(); a.nAuto.hidden = false; a.price.value = "80000"; a.price.oninput(); a.pAuto.hidden = false;
      a.desc.value = "바퀴 상태 좋아요"; a.desc.oninput(); a.S.photoId = "p4"; a.paintPhoto(); a.showHelperMsg(note("ok", "checkc", "가져왔어요. 확인하고 올려 주세요", "")); a.paintWhy(); break; }
    case "sell2_err": { const s = base(); s.me.home = null; go(s); const L = openSell(); const a = L.api; a.price.value = "0"; a.price.oninput(); a.S.loc = "home"; a.paintLoc();
      a.homeIn.value = "서교동"; setErr(a.homeErr, T.noHome); a.homeIn.classList.add("bad");
      setErr(a.nErr, T.needName); a.name.classList.add("bad"); setErr(a.pErr, T.zeroPrice); a.price.classList.add("bad");
      a.showHelperMsg(note("bad", "alert", T.linkHost, "")); break; }
    case "request": { const s = base(); s.requests = [reqA, Object.assign({}, reqA, { id: "r2" })]; seen.r2 = Date.now(); autoSeen.add("r2"); go(s, "wants"); openRequest("r1"); break; }
    case "deal": { const s = base(); s.deal = dealA; go(s); openDeal(); break; }
    case "deal_wait": { const s = base(); s.deal = Object.assign({}, dealA, { place: null, buyer_eta_min: null }); go(s); openDeal(); break; }
    case "review1": go(ask()); openReview(); break;
    case "review2": go(ask()); openReview(); setTimeout(() => { const b = document.querySelectorAll(".stars button")[4]; b && b.click(); }, 0); break;
    case "urgent": { const s = base(); s.urgents = [urgA]; go(s); openUrgent("u1"); break; }
    case "wants": { const s = base(); s.deal = dealA; go(s, "wants"); break; }
    case "wants_empty": { const s = base(); s.car = false; s.me.wants = []; go(s, "wants"); break; }
    case "me": notifyBridge(); go(base(), "me"); break;
    case "me_nocar": { const s = base(); s.car = false; s.me.plate4 = ""; s.me.home = null; go(s, "me"); break; }
    case "pair": { const s = base(); s.car = false; go(s); const fm = openPair(); fm.L.api.code.value = "482931"; setErr(fm.L.api.cErr, T.code403); fm.L.api.code.classList.add("bad"); fm.L.api.plate.value = "12가 3456"; break; }
    case "homeaddr": { const s = base(); s.me.home = null; go(s, "me"); openHomeAddr(); break; }
    default: go(base());
  }
}

// ───────── 시작 ─────────
(function boot() {
  const mockName = location.protocol === "file:" ? (new URLSearchParams(location.hash.slice(1)).get("mock") || "") : "";
  if (mockName) { runMock(mockName); return; }
  // 카카오 로그인에서 돌아오면 주소의 # 뒤에 토큰(t) 또는 실패(e)가 실려 와요. 읽고 바로 주소에서 지워요
  const hs = new URLSearchParams(location.hash.slice(1));
  if (hs.get("t")) save("rm_phone", hs.get("t"));
  if (hs.get("e")) loginErr = true;
  if (location.hash) history.replaceState(null, "", location.pathname);
  token = load("rm_phone");
  if (token) begin();
  else { drawStart(); showScreen("start"); loginOptions(); }
})();
</script>
